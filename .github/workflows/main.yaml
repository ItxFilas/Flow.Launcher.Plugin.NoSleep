name: Publish Release

on:
  push:
    branches: [ main ]
    paths-ignore: 
      - .github/workflows/*
      - Readme.md
      - docs/**
      - Images/readme/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json -Raw | ConvertFrom-Json).Version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          dotnet publish 'Flow.Launcher.Plugin.NoSleep.csproj' -r win-x64 -c Release -o "NoSleep-${{ steps.version.outputs.version }}"
          Compress-Archive -Path "NoSleep-${{ steps.version.outputs.version }}/*" -DestinationPath "NoSleep-${{ steps.version.outputs.version }}.zip" -Force
          Remove-Item "NoSleep-${{ steps.version.outputs.version }}" -Recurse -Force

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: "NoSleep-${{ steps.version.outputs.version }}.zip"
          tag_name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
